spring.application.name=seatlock
server.port=${PORT:8080}

# Local runs can keep settings in backend/.env (git-ignored, see .env.example). On Render they are env vars.
spring.config.import=optional:file:.env[.properties]

# Only the health endpoint is public (used by Render and the frontend's wake-up check).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Errors are returned as standard JSON problem details (RFC 9457): {"status":404,"detail":"..."}
spring.mvc.problemdetails.enabled=true

# Render's proxy passes the visitor's IP in X-Forwarded-For. Tomcat reads it right to left and stops at the
# first address that isn't an internal proxy, so a client can't pretend to be someone else (rate limit).
server.forward-headers-strategy=native

# --- Database ---
# Production: DATABASE_URL from Neon, pasted as Neon shows it (postgresql://user:password@host/db?sslmode=require).
# Without it, an in-memory H2 database in PostgreSQL mode is used, so local runs and tests need no setup.
# Each Spring context gets its own H2 database (random name), so tests never see each other's rows.
seatlock.database-url=${DATABASE_URL:}
spring.datasource.url=jdbc:h2:mem:seatlock-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Flyway owns the schema (src/main/resources/db/migration). Hibernate only reads and writes rows,
# and checks on startup that the Java entities match the tables Flyway created.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Seat holds ---
# A clicked seat is held this long; if the guest doesn't pay, Redis forgets the hold by itself.
seatlock.holds.duration=5m
# Production: Upstash's address (rediss://default:password@host:6379). Empty = in-memory holds (local runs, tests).
seatlock.holds.redis-url=${REDIS_URL:}
# Redis is set up in HoldStoreConfig only when a URL is given, so Boot's own Redis setup (which would try
# localhost:6379) is switched off. Holds are plain keys, so Spring Data Redis repositories are not needed.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# --- Browser access ---
# Pages allowed to call the API and open the live seat-map WebSocket. Comma-separated;
# e.g. https://seatlock.vercel.app,https://*.vercel.app
seatlock.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# --- Abuse protection for the public demo ---
# API requests per visitor (IP) per minute; more get 429 + Retry-After. Counted in Redis when configured.
# Opening a show costs ~3 requests and every seat click 1, so real visitors never get near it. 0 = off.
seatlock.rate-limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:120}

# --- Demo data ---
# Adds 4 shows (96 seats each) on startup whenever there are no upcoming shows.
seatlock.demo-data.enabled=${DEMO_DATA:true}
# Show times are set in this time zone (e.g. 21:00 local time).
seatlock.demo-data.zone=Asia/Kolkata
