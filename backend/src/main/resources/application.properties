spring.application.name=seatlock
server.port=${PORT:8080}

# Only the health endpoint is public (used by Render and the frontend's wake-up check).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Errors are returned as standard JSON problem details (RFC 9457): {"status":404,"detail":"..."}
spring.mvc.problemdetails.enabled=true

# --- Database ---
# Local runs and tests use an in-memory H2 database in PostgreSQL mode, so they need no setup.
# Each Spring context gets its own database (random name), so tests never see each other's rows.
# Real Postgres is tested with Testcontainers in CI; Neon is wired up at deploy time (step 8).
spring.datasource.url=jdbc:h2:mem:seatlock-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Flyway owns the schema (src/main/resources/db/migration). Hibernate only reads and writes rows,
# and checks on startup that the Java entities match the tables Flyway created.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Seat holds ---
# A clicked seat is held this long; if the guest doesn't pay, Redis forgets the hold by itself.
seatlock.holds.duration=5m
# Production: Upstash's address (rediss://default:password@host:6379). Empty = in-memory holds (local runs, tests).
seatlock.holds.redis-url=${REDIS_URL:}
# Redis is set up in HoldStoreConfig only when a URL is given, so Boot's own Redis setup (which would try
# localhost:6379) is switched off. Holds are plain keys, so Spring Data Redis repositories are not needed.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# --- Demo data ---
# Adds 4 shows (96 seats each) on startup whenever there are no upcoming shows.
seatlock.demo-data.enabled=${DEMO_DATA:true}
# Show times are set in this time zone (e.g. 21:00 local time).
seatlock.demo-data.zone=Asia/Kolkata
